name: Test

# Builds and tests this repo against a pinned release of github.com/qrazil/m31
# and a pinned commit of github.com/qrazil/tui.
#
# This repo is several .m31 files, compiled by m31c and then linked, as
# ordinary C, directly against the m31 runtime's own source files (there is
# no pre-built runtime library to link against instead). qrazil/m31's own
# release tarballs bundle exactly that (config.sh + runtime/, see that
# repo's release.yml and docs/apps-repo-split-decision.md), alongside the
# compiler binary itself.
#
# gitui.m31 (and so test_gitui.sh/test_hunks.sh, which build it and its own
# unit harnesses) additionally imports several github.com/qrazil/tui
# widgets -- this compiler resolves every `import` against the entry file's
# own directory only, so those files have to be staged in from a real
# checkout at build time (build-gitui.sh's own header has the full
# reasoning). TUI_REF is a commit SHA, not a tag: qrazil/tui has no release
# process of its own (it is a library, not a standalone binary -- see its
# own test.yml for why), so a specific commit is the only reproducible
# pin available.
#
# Bump M31_REF/TUI_REF by hand when this repo should pick up a newer m31
# release or a newer tui commit -- see qrazil/m31's own
# docs/apps-repo-split-decision.md section 6a for why this is a manual
# step, not automatic, and the tradeoffs of the alternatives (tracking
# `latest`/the tui default branch, or a cross-repo bump-PR bot).
env:
  M31_REF: v0.1.1
  TUI_REF: bb7b778500a11ae5a522611e0a6df98c207d1ef6

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test-linux-x86_64:
    name: Test — Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-x86_64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Fetch the pinned qrazil/tui commit (${{ env.TUI_REF }})
        run: |
          set -euo pipefail
          mkdir -p tui
          git -C tui init -q
          git -C tui remote add origin https://github.com/qrazil/tui.git
          git -C tui fetch -q --depth 1 origin "${{ env.TUI_REF }}"
          git -C tui checkout -q FETCH_HEAD
          echo "TUI_ROOT=$PWD/tui" >> "$GITHUB_ENV"

      - name: Test
        run: bash test.sh

  test-linux-aarch64:
    name: Test — Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-aarch64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Fetch the pinned qrazil/tui commit (${{ env.TUI_REF }})
        run: |
          set -euo pipefail
          mkdir -p tui
          git -C tui init -q
          git -C tui remote add origin https://github.com/qrazil/tui.git
          git -C tui fetch -q --depth 1 origin "${{ env.TUI_REF }}"
          git -C tui checkout -q FETCH_HEAD
          echo "TUI_ROOT=$PWD/tui" >> "$GITHUB_ENV"

      - name: Test
        run: bash test.sh

  test-macos-arm64:
    name: Test — macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o m31.tar.gz \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-macos-arm64.tar.gz"
          mkdir -p m31
          tar -C m31 -xzf m31.tar.gz
          chmod +x m31/m31c
          echo "LANGC=$PWD/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$PWD/m31" >> "$GITHUB_ENV"

      - name: Fetch the pinned qrazil/tui commit (${{ env.TUI_REF }})
        run: |
          set -euo pipefail
          mkdir -p tui
          git -C tui init -q
          git -C tui remote add origin https://github.com/qrazil/tui.git
          git -C tui fetch -q --depth 1 origin "${{ env.TUI_REF }}"
          git -C tui checkout -q FETCH_HEAD
          echo "TUI_ROOT=$PWD/tui" >> "$GITHUB_ENV"

      - name: Test
        run: bash test.sh
